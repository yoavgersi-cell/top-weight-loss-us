name: IndexNow

# After each push to main, wait for the Vercel deploy to go live, then tell
# Bing (IndexNow) which pages changed. Run manually with "all" to resubmit
# every sitemap URL.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      all:
        description: "Submit every sitemap URL"
        type: boolean
        default: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Wait for the deploy to serve the key file
        run: |
          sleep 180
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" https://www.topweightloss.us/f95eb935c67033ab546c2fd3ba63c81a.txt)
            [ "$code" = "200" ] && echo "Key file live" && exit 0
            sleep 20
          done
          echo "Key file not live" && exit 1
      - name: Submit to IndexNow
        run: node scripts/indexnow.mjs ${{ github.event.inputs.all == 'true' && '--all' || '' }}
